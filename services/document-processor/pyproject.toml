[project]
name = "medmemory-document-processor"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "numpy>=2.2,<3",
  "opencv-python-headless>=4.11,<5",
  "pillow>=11,<13",
  "pydantic-settings>=2.7,<3",
  "pymupdf>=1.25,<2",
  "pytesseract>=0.3.13,<1",
  "uvicorn>=0.34,<1",
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]
openmed = ["openmed==2.3.0"]
clinical-brain = ["openmed[gliner]==2.3.0"]
paddleocr = ["paddleocr>=2.7,<4", "paddlepaddle==3.3.1"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["app/tests"]
[tool.ruff]
target-version = "py310"
line-length = 100
